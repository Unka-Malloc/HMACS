syntax = "proto3";

package hmacs.v1;

// =====================
// Common types
// =====================

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Amount {
  string value = 1;
  string asset = 2;
}

// =====================
// Identity & Auth
// =====================

service AuthService {
  rpc WalletSignIn(WalletSignInRequest) returns (WalletSignInResponse);
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc VerifyApiKey(VerifyApiKeyRequest) returns (VerifyApiKeyResponse);
}

message WalletSignInRequest {
  string wallet_address = 1;
  string chain = 2;
  string message = 3;
  string signature = 4;
}

message WalletSignInResponse {
  string token = 1;
  string participant_id = 2;
}

message CreateApiKeyRequest {
  string label = 1;
  uint32 expires_in_days = 2;
}

message CreateApiKeyResponse {
  string id = 1;
  string raw_key = 2;
  string label = 3;
  optional Timestamp expires_at = 4;
}

message VerifyApiKeyRequest {
  string api_key = 1;
}

message VerifyApiKeyResponse {
  bool valid = 1;
  string participant_id = 2;
}

// =====================
// Task Market
// =====================

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (TaskResponse);
  rpc GetTask(GetTaskRequest) returns (TaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc PlaceBid(PlaceBidRequest) returns (BidResponse);
  rpc AcceptBid(AcceptBidRequest) returns (TaskResponse);
  rpc StartTask(TaskActionRequest) returns (TaskResponse);
  rpc DeliverTask(DeliverTaskRequest) returns (TaskResponse);
  rpc ApproveDelivery(TaskActionRequest) returns (TaskResponse);
  rpc DisputeDelivery(TaskActionRequest) returns (TaskResponse);
  rpc CancelTask(TaskActionRequest) returns (TaskResponse);
  rpc ListBids(GetTaskRequest) returns (ListBidsResponse);
}

message CreateTaskRequest {
  string title = 1;
  string description = 2;
  repeated string skill_tags = 3;
  string budget_asset = 4;
  string budget_amount = 5;
  string restriction = 6;
  optional Timestamp deadline = 7;
}

message GetTaskRequest {
  string task_id = 1;
}

message ListTasksRequest {
  optional string status = 1;
  uint64 page = 2;
  uint64 per_page = 3;
}

message TaskResponse {
  string id = 1;
  string creator_id = 2;
  string title = 3;
  string description = 4;
  repeated string skill_tags = 5;
  string budget_asset = 6;
  string budget_amount = 7;
  string status = 8;
  string restriction = 9;
  optional string assigned_to = 10;
  optional Timestamp deadline = 11;
  Timestamp created_at = 12;
  Timestamp updated_at = 13;
  optional string deliverable_url = 14;
  optional string deliverable_notes = 15;
}

message ListTasksResponse {
  repeated TaskResponse tasks = 1;
  uint64 total = 2;
}

message PlaceBidRequest {
  string task_id = 1;
  string amount = 2;
  string asset = 3;
  string proposal = 4;
  optional double estimated_duration_hours = 5;
}

message BidResponse {
  string id = 1;
  string task_id = 2;
  string bidder_id = 3;
  string amount = 4;
  string asset = 5;
  string proposal = 6;
  string status = 7;
  Timestamp created_at = 8;
}

message AcceptBidRequest {
  string task_id = 1;
  string bid_id = 2;
}

message TaskActionRequest {
  string task_id = 1;
}

message DeliverTaskRequest {
  string task_id = 1;
  optional string deliverable_url = 2;
  optional string deliverable_notes = 3;
}

message ListBidsResponse {
  repeated BidResponse bids = 1;
}

// =====================
// Compute Market
// =====================

service ComputeService {
  rpc RegisterResource(RegisterResourceRequest) returns (ResourceResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc CreateListing(CreateListingRequest) returns (ListingResponse);
  rpc ListListings(ListListingsRequest) returns (ListListingsResponse);
  rpc PurchaseLease(PurchaseLeaseRequest) returns (LeaseResponse);
  rpc GetLease(GetLeaseRequest) returns (LeaseResponse);
  rpc ReportUsage(ReportUsageRequest) returns (LeaseResponse);
  rpc GetPriceGuidance(PriceGuidanceRequest) returns (PriceGuidanceResponse);
}

message GpuInfo {
  string model = 1;
  uint32 vram_gb = 2;
  uint32 count = 3;
}

message RegisterResourceRequest {
  uint32 cpu_cores = 1;
  uint32 memory_gb = 2;
  optional GpuInfo gpu = 3;
  optional uint32 bandwidth_mbps = 4;
  optional uint32 storage_gb = 5;
  optional string region = 6;
  repeated string tags = 7;
}

message ResourceResponse {
  string id = 1;
  string owner_id = 2;
  uint32 cpu_cores = 3;
  uint32 memory_gb = 4;
  optional GpuInfo gpu = 5;
  string status = 6;
  Timestamp created_at = 7;
}

message ListResourcesRequest {
  optional uint32 min_cpu_cores = 1;
  optional uint32 min_memory_gb = 2;
  optional uint32 min_gpu_vram_gb = 3;
  optional string gpu_model = 4;
  optional string region = 5;
}

message ListResourcesResponse {
  repeated ResourceResponse resources = 1;
}

message CreateListingRequest {
  string resource_id = 1;
  oneof pricing {
    BulkPackagePricing bulk_package = 2;
    PerUnitTimePricing per_unit_time = 3;
    FreePricing free_price = 4;
  }
}

message BulkPackagePricing {
  string total_units = 1;
  string unit_label = 2;
  string total_price = 3;
  string asset = 4;
}

message PerUnitTimePricing {
  string price_per_unit = 1;
  string unit_label = 2;
  string asset = 3;
  optional string min_units = 4;
  optional string max_units = 5;
}

message FreePricing {
  string asking_price = 1;
  string asset = 2;
  string unit_label = 3;
  string quantity = 4;
}

message ListingResponse {
  string id = 1;
  string resource_id = 2;
  string seller_id = 3;
  bool active = 4;
  Timestamp created_at = 5;
}

message ListListingsRequest {
  bool active_only = 1;
}

message ListListingsResponse {
  repeated ListingResponse listings = 1;
}

message PurchaseLeaseRequest {
  string listing_id = 1;
  optional string units = 2;
}

message GetLeaseRequest {
  string lease_id = 1;
}

message LeaseResponse {
  string id = 1;
  string resource_id = 2;
  string buyer_id = 3;
  string seller_id = 4;
  string asset = 5;
  string price_per_unit = 6;
  string unit_label = 7;
  string units_consumed = 8;
  string total_cost = 9;
  string status = 10;
  Timestamp started_at = 11;
}

message ReportUsageRequest {
  string lease_id = 1;
  string units = 2;
}

message PriceGuidanceRequest {
  string unit_label = 1;
  string asset = 2;
}

message PriceGuidanceResponse {
  string unit_label = 1;
  string asset = 2;
  string average_price = 3;
  string median_price = 4;
  string low_price = 5;
  string high_price = 6;
  string recommended_low = 7;
  string recommended_high = 8;
  uint64 supply_count = 9;
  uint64 demand_count = 10;
  double supply_demand_ratio = 11;
}

// =====================
// Wallet
// =====================

service WalletService {
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);
  rpc GetBalance(GetBalanceRequest) returns (BalanceResponse);
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse);
}

message GetBalancesRequest {}

message GetBalancesResponse {
  repeated BalanceResponse balances = 1;
}

message GetBalanceRequest {
  string asset = 1;
}

message BalanceResponse {
  string wallet_id = 1;
  string participant_id = 2;
  string asset = 3;
  string available = 4;
  string frozen = 5;
}

message GetLedgerRequest {
  uint64 page = 1;
  uint64 per_page = 2;
}

message GetLedgerResponse {
  repeated LedgerEntryResponse entries = 1;
  uint64 total = 2;
}

message LedgerEntryResponse {
  string id = 1;
  string entry_type = 2;
  string asset = 3;
  string amount = 4;
  int32 direction = 5;
  string balance_after = 6;
  optional string reference_id = 7;
  optional string description = 8;
  Timestamp created_at = 9;
}
