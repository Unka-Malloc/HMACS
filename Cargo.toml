[workspace]
resolver = "2"
members = [
    "crates/hmacs-core",
    "crates/hmacs-identity",
    "crates/hmacs-engine",
    "crates/hmacs-task",
    "crates/hmacs-compute",
    "crates/hmacs-wallet",
    "crates/hmacs-settlement",
    "crates/hmacs-storage",
    "crates/hmacs-api",
    "crates/hmacs-sdk",
    "crates/hmacs-compliance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anthropic/hmacs"

[workspace.dependencies]
# Internal crates
hmacs-core = { path = "crates/hmacs-core" }
hmacs-identity = { path = "crates/hmacs-identity" }
hmacs-engine = { path = "crates/hmacs-engine" }
hmacs-task = { path = "crates/hmacs-task" }
hmacs-compute = { path = "crates/hmacs-compute" }
hmacs-wallet = { path = "crates/hmacs-wallet" }
hmacs-settlement = { path = "crates/hmacs-settlement" }
hmacs-storage = { path = "crates/hmacs-storage" }
hmacs-api = { path = "crates/hmacs-api" }
hmacs-sdk = { path = "crates/hmacs-sdk" }
hmacs-compliance = { path = "crates/hmacs-compliance" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# gRPC
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto & Auth
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
jsonwebtoken = "9"
bs58 = "0.5"

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ulid = { version = "1", features = ["serde"] }

# Decimal math
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Config
config = "0.14"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Blockchain (Solana)
solana-sdk = "2"
solana-client = "2"
spl-token = "6"

# Blockchain (EVM)
alloy = { version = "0.5", features = ["full"] }

# Misc
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
